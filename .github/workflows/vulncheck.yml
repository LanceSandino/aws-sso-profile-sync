name: Scheduled vulnerability scan
# Re-runs govulncheck weekly so advisories published after the last push are
# reported without waiting for a code change.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  govulncheck:
    name: Scheduled govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare disposable vulnerability-scan caches
        run: |
          printf 'GOCACHE=%s/aws-sso-vuln-build\nGOMODCACHE=%s/aws-sso-vuln-mod\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Reachable vulnerabilities in shipping and integration code
        run: |
          set -euo pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags integration -test ./...
